name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RUST_TEST_THREADS: "1"
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: stable / test and specification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable Rust with lint components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Temurin 25.0.4+7
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+7.0.LTS"

      - name: Install Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests with two fixed independent seeds (pass 1)
        env:
          PROPTEST_RNG_SEED: "5350648285461741569"
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run workspace tests with two fixed independent seeds (pass 2)
        env:
          PROPTEST_RNG_SEED: "5350648285461741570"
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run ignored JDK 25 instruction-boundary oracle
        run: cargo test --test jvm_bytecode_oracle --locked -- --ignored --exact jdk25_instruction_boundaries_match_public_bytecode_inspection

      - name: Run public API example
        run: |
          cargo run --example inspect_class_header --locked -- tests/fixtures/historical/ecj-4.6.1/v52/HistoricalControlFlow.class
          cargo run --example resolve_and_analyze --locked -- tests/fixtures/historical/ecj-4.6.1/v52/HistoricalControlFlow.class

      - name: Check resolved feature tree
        run: |
          cargo tree --workspace --all-features --locked -e features > "$RUNNER_TEMP/feature-tree.txt"
          grep -F 'blake3 feature "pure"' "$RUNNER_TEMP/feature-tree.txt"
          grep -F 'flate2 feature "rust_backend"' "$RUNNER_TEMP/feature-tree.txt"

      - name: Check normal dependency tree boundary
        run: |
          cargo tree --workspace --all-features --locked -e normal > "$RUNNER_TEMP/normal-tree.txt"
          if grep -E '(^|[[:space:]├└─])(tokio([^[:alnum:]_]|$)|async-std([^[:alnum:]_]|$)|rayon([^[:alnum:]_]|$)|petgraph([^[:alnum:]_]|$)|sqlx([^[:alnum:]_]|$)|rusqlite([^[:alnum:]_]|$)|tree-sitter([^[:alnum:]_]|$)|reverse-engine-backend-api([^[:alnum:]_]|$)|ristretto_vm([^[:alnum:]_]|$)|jni([^[:alnum:]_]|$)|jvm([^[:alnum:]_]|$)|reqwest([^[:alnum:]_]|$)|hyper([^[:alnum:]_]|$)|ureq([^[:alnum:]_]|$)|surf([^[:alnum:]_]|$)|diesel([^[:alnum:]_]|$)|sea-orm([^[:alnum:]_]|$)|mongodb([^[:alnum:]_]|$)|redis([^[:alnum:]_]|$))' "$RUNNER_TEMP/normal-tree.txt"; then
            echo 'unexpected production dependency crossed the P0 boundary' >&2
            exit 1
          fi

      - name: Install OpenSpec 1.11.0
        run: npm install --global @fission-ai/openspec@1.11.0

      - name: Validate OpenSpec strictly
        run: openspec validate --all --strict --no-interactive

      - name: Ensure tracked files remain unchanged
        run: git diff --exit-code

  msrv:
    name: MSRV 1.88.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --locked

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check root workspace advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features --workspace --locked --config ./deny.toml
          manifest-path: ./Cargo.toml
      - name: Check fuzz workspace advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features --workspace --locked --config ./deny.toml
          manifest-path: ./fuzz/Cargo.toml

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    # Bounded smoke gate only (design 3.3): it proves that the committed corpus and the
    # two targets survive a short single-worker libFuzzer run without panicking, without
    # crossing a public budget and without claiming completeness for damaged input. It is
    # not a security or coverage proof: 20 seconds per target, no continuous fuzzing, no
    # corpus accumulation between runs. The local gate runs the same targets for 60
    # seconds; only the time budget differs.
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install nightly-2026-07-20
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install cargo-fuzz 0.13.2
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Prepare the C++ and sanitizer toolchain
        run: |
          # The ubuntu-24.04 image already ships clang/llvm and gcc, and the nightly
          # toolchain ships the AddressSanitizer runtime for x86_64-unknown-linux-gnu, so
          # no package install is required. The versions are printed for the record; add
          # `sudo apt-get install -y clang` here if a future image drops clang.
          clang --version
          clang++ --version
          cargo --version

      - name: Check the committed corpus against the targets
        # Replays every committed seed once and asserts the seed facts (a valid seed
        # really answers the fixed requests, a damaged one is reported instead of
        # claiming completeness). A corpus that only reached `open` failures would still
        # "pass" a pure libFuzzer smoke, this step is what keeps it honest.
        run: cargo +nightly-2026-07-20 test --manifest-path fuzz/Cargo.toml --locked

      - name: Run the bounded query smoke
        run: |
          # New corpus entries and crash artifacts must not land in the tracked tree:
          # the run starts from a scratch copy of the committed corpus, and crash inputs
          # go to the ignored fuzz/artifacts/<target>/ directory.
          mkdir -p "$RUNNER_TEMP/corpus/query"
          cp -r fuzz/corpus/query/. "$RUNNER_TEMP/corpus/query/"
          cd fuzz
          cargo +nightly-2026-07-20 fuzz run query "$RUNNER_TEMP/corpus/query" -- \
            -max_total_time=20 -max_len=65536 -rss_limit_mb=512 -timeout=10 -workers=1 -print_final_stats=1

      - name: Run the bounded artifact-tree smoke
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/artifact_tree"
          cp -r fuzz/corpus/artifact_tree/. "$RUNNER_TEMP/corpus/artifact_tree/"
          cd fuzz
          cargo +nightly-2026-07-20 fuzz run artifact_tree "$RUNNER_TEMP/corpus/artifact_tree" -- \
            -max_total_time=20 -max_len=65536 -rss_limit_mb=512 -timeout=10 -workers=1 -print_final_stats=1

      - name: Ensure the smoke runs left the tracked tree unchanged
        # Mirrors the `stable` job's `git diff --exit-code`, and also fails on a new
        # *untracked* file outside the ignored fuzz paths (a corpus entry written into
        # the tracked corpus directory would show up here).
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
