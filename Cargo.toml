[workspace]
resolver = "3"
members = [
    ".",
    "crates/jarde-cli",
    "crates/jarde-jvm",
    "crates/jarde-query",
    "crates/jarde-reader",
]

[package]
name = "jarde"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Bounded, provenance-preserving JVM artifact analysis contracts"

[dependencies]
# The three layers this facade composes and re-exports. The analysis above the reader's facts —
# resolution, the JVM environment, CFG, the pass layers and the method-analysis driver — left
# for `jarde-jvm` in the layering work of P2 2.2, and with it the `blake3`, `petgraph` and
# `serde` dependencies only that layer names.
jarde-jvm = { path = "crates/jarde-jvm", version = "=0.1.0" }
jarde-query = { path = "crates/jarde-query", version = "=0.1.0" }
jarde-reader = { path = "crates/jarde-reader", version = "=0.1.0" }

[dev-dependencies]
# The integration tests read fixture archives directly: `flate2`/`rawzip` build the ZIP and
# deflate fixtures, `serde_json` reads the serde spellings the reports use, `proptest` drives
# the property suites, and `blake3`/`petgraph` are the hashing and graph crates those tests name
# by path now that the library itself no longer declares them.
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
proptest = "=1.11.0"
rawzip = "=0.5.1"
serde_json = "=1.0.151"
