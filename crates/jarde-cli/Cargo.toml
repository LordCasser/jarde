[package]
name = "jarde-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Single-request JSON CLI adapter for bounded jarde analysis"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
jarde = { path = "../..", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
