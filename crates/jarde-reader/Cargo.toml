[package]
name = "jarde-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Bounded JVM artifact and class-file reading: snapshots, identities, facts and inspection"

[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
noak = "=0.7.0"
rawzip = "=0.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.20"

[features]
# A test-only class-file builder (`classfile::test_class`) shared across the module boundaries
# that become crate boundaries: a dependent crate's tests build fixtures through this reader,
# whose `cfg(test)` they cannot see. No normal dependency enables this, so it stays out of
# production builds; `--all-features` (as CI runs) does enable it, and the module is written to
# compile warning-free either way.
test-support = []

[dev-dependencies]
proptest = "=1.11.0"
serde_json = "=1.0.151"
