[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Vulnerability advisories are denied by cargo-deny's default advisory policy.
yanked = "deny"
unsound = "all"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

# `libfuzzer-sys` vendors LLVM's libFuzzer runtime under the University of
# Illinois/NCSA permissive license. Keep this additional license scoped to the
# exact test-only crate/version; it must not become a global allowance.
[[licenses.exceptions]]
crate = "libfuzzer-sys@0.4.13"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
