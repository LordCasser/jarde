[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Vulnerability advisories are denied by cargo-deny's default advisory policy.
yanked = "deny"
unsound = "all"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  # `libfuzzer-sys` vendors LLVM's libFuzzer runtime under the University of
  # Illinois/NCSA permissive license. It is only reachable from the test-only
  # `fuzz` workspace (its own workspace root, never a production dependency);
  # the allowance is recorded here so one policy file stays authoritative.
  "NCSA",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
